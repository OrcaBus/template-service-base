repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^(pnpm-lock.yaml)
      - id: check-yaml
        exclude: ^(pnpm-lock.yaml) # pnpm 12 writes a multi-document lockfile
      - id: detect-aws-credentials
        args: [ --allow-missing-credentials ]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [ --branch, main, --branch, master, --pattern, release/.* ]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: pnpm-lock.yaml

  - repo: local
    hooks:
      # Runs the repo's own ESLint (and typescript-eslint config) instead of a pinned mirror
      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        files: \.(m|c)?[jt]sx?$
        exclude: ^app/
      - id: prettier
        name: prettier Format
        entry: pnpm prettier
        language: system
